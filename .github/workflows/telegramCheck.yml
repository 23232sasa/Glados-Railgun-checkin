name: Telegram daily check-in
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0-15 * * *'
permissions:
  contents: read
concurrency:
  group: telegram-checkin
  cancel-in-progress: false
jobs:
  checkin:
    if: vars.TG_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Restore retry state
        uses: actions/cache/restore@v4
        with:
          path: telegram-state
          key: telegram-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: telegram-state-v1-
      - name: Install dependencies
        run: python -m pip install -r telegram_checkin/requirements.txt
      - name: Check all Telegram accounts
        run: python telegram_checkin/runner.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSIONS: ${{ secrets.TG_SESSIONS }}
      - name: Save retry state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: telegram-state
          key: telegram-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
