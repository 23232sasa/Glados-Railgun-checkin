name: GLaDOS daily check-in
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'
permissions:
  contents: read
concurrency:
  group: glados-checkin
  cancel-in-progress: false
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install requests pypushdeer
      - name: Check in and redeem eligible points
        run: python checkin.py
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_DOMAIN: ${{ vars.GLADOS_DOMAIN }}
          GLADOS_EXCHANGE_PLAN: ${{ vars.GLADOS_EXCHANGE_PLAN || secrets.GLADOS_EXCHANGE_PLAN || 'plan500' }}
          GLADOS_VERBOSE: 'false'
